# Generates profile/streak.svg locally so the README never depends on
# the discontinued Heroku endpoint.
name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # re-run when this file changes
  workflow_dispatch: # manual run from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          # Theme matched to the profile palette (#0D1117 background, #F59E0B accent).
          # Animations disabled for maximum rendering compatibility.
          options: user=${{ github.repository_owner }}&hide_border=true&background=0D1117&ring=F59E0B&fire=F59E0B&currStreakLabel=F59E0B&currStreakNum=E6EDF3&sideNums=E6EDF3&sideLabels=8B949E&dates=8B949E&stroke=8B949E&disable_animations=true
          path: profile/streak.svg
          # Default repository token — never put a personal token here.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: update streak stats" || exit 0
          git push
